# Pings the API every few days so the free Supabase project never reaches
# its one-week inactivity pause (and the free Render service is warmed up).
#
# Setup: GitHub repo > Settings > Secrets and variables > Actions >
#        New repository secret:  API_URL = https://your-service.onrender.com
name: keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API (and through it, the database)
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "Set the API_URL secret first."; exit 1; fi
          # The free Render service can take about a minute to wake up.
          curl --fail --silent --show-error --retry 4 --retry-delay 20 --max-time 120 "$API_URL/api/ping"
